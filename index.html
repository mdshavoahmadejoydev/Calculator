<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="css/index.css">
</head>
<body>
    <div class="container">
        <div class="container_inside">
            <div class="display_element box">
                <input class="display_result" type="text" placeholder="Type your problem" readonly>
            </div>
            <div class="all_buttons box">
                <button class="btn1">%</button>
                <button class="btn1">CE</button>
                <button class="btn1">C</button>
                <button class="btn1">DE</button>
                <button class="btn1">7</button>
                <button class="btn1">8</button>
                <button class="btn1">9</button>
                <button class="btn1">X</button>
                <button class="btn1">4</button>
                <button class="btn1">5</button>
                <button class="btn1">6</button>
                <button class="btn1">/</button>
                <button class="btn1">1</button>
                <button class="btn1">2</button>
                <button class="btn1">3</button>
                <button class="btn1">-</button>
                <button class="btn1">0</button>
                <button class="btn1">.</button>
                <button class="btn1">=</button>
                <button class="btn1">+</button>
            </div>
        </div>
    </div>
</body>
</html>
