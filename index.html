<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="./css/index.css">
</head>
<body>
    <div class="container">
        <div class="container_inside">
            <div class="display_element box">
              <input class="display_result" type="text" placeholder="Type your problem" readonly>
            </div>
            <div class="all_buttons box">
              <button class="btn1">%</button>
                
              <button class="btn1">CE</button>
              
              <button class="btn1" onclick="
              innerCalculations = '';
              displayElement.value = innerCalculations;
              ">C</button>
              
              <button class="btn1">DE</button>
              
              <button class="btn1" onclick="
              innerCalculations += '7';
              displayElement.value = innerCalculations;
              ">7</button>
              
              <button class="btn1" onclick="
              innerCalculations += '8';
              displayElement.value = innerCalculations;
              ">8</button>
              
              <button class="btn1" onclick="
              innerCalculations += '9';
              displayElement.value = innerCalculations;
              ">9</button>
              
              <button class="btn1" onclick="
              innerCalculations += '*';
              displayElement.value = innerCalculations;
              ">X</button>
              
              <button class="btn1" onclick="
              innerCalculations += '4';
              displayElement.value = innerCalculations;
              ">4</button>
              
              <button class="btn1" onclick="
              innerCalculations += '5';
              displayElement.value = innerCalculations;
              ">5</button>
              
              <button class="btn1" onclick="
              innerCalculations += '6';
              displayElement.value = innerCalculations;
              ">6</button>
              
              <button class="btn1" onclick="
              innerCalculations += '/';
              displayElement.value = innerCalculations;
              ">/</button>
              
              <button class="btn1" onclick="
              innerCalculations += '1';
              displayElement.value = innerCalculations;
              ">1</button>
              
              <button class="btn1" onclick="
              innerCalculations += '2';
              displayElement.value = innerCalculations;
              ">2</button>
              
              <button class="btn1" onclick="
              innerCalculations += '3';
              displayElement.value = innerCalculations;
              ">3</button>
              
              <button class="btn1" onclick="
              innerCalculations += '-';
              displayElement.value = innerCalculations;
              ">-</button>
              
              <button class="btn1" onclick="
              innerCalculations += '0';
              displayElement.value = innerCalculations;
              ">0</button>
              
              <button class="btn1" onclick="
              innerCalculations += '.';
              displayElement.value = innerCalculations;
              ">.</button>
              
              <button class="btn1" onclick="
              if(!innerCalculations) {
                  return null
              }
              innerCalculations = eval(innerCalculations);displayElement.value = innerCalculations;">=</button>
              
              <button class="btn1" onclick="
              innerCalculations += '+';
              displayElement.value = innerCalculations;
              ">+</button>
            </div>
        </div>
    </div>
    <script src="./js/index.js"></script>
</body>
</html>
